run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - misspell
    - gocritic
    - gosec
    - bodyclose
    - noctx
    - prealloc
    - unconvert
    - unparam

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck
  govet:
    disable:
      - fieldalignment
  gocritic:
    disabled-checks:
      - appendAssign
  misspell:
    locale: US

issues:
  exclude-rules:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - gocritic
        - gosec
    # Exclude known false positives.
    - text: "G104"
      linters:
        - gosec
    - text: "G304"
      linters:
        - gosec
