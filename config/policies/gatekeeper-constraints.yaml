# Constraint Template: Require dropped capabilities.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdropallcapabilities
  labels:
    app.kubernetes.io/name: platform-operator
    policy: security
spec:
  crd:
    spec:
      names:
        kind: K8sDropAllCapabilities
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdropallcapabilities

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.securityContext.capabilities
          msg := sprintf("Container %v must drop ALL capabilities", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not contains(container.securityContext.capabilities.drop, "ALL")
          msg := sprintf("Container %v must include ALL in capabilities.drop", [container.name])
        }

        contains(arr, elem) {
          arr[_] == elem
        }
---
# Constraint: Enforce dropped capabilities.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDropAllCapabilities
metadata:
  name: platform-operator-drop-all-caps
  labels:
    app.kubernetes.io/name: platform-operator
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces:
      - platform-operator-system
---
# Constraint Template: Require resource limits.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequireresourcelimits
  labels:
    app.kubernetes.io/name: platform-operator
    policy: security
spec:
  crd:
    spec:
      names:
        kind: K8sRequireResourceLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequireresourcelimits

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.resources.limits
          msg := sprintf("Container %v must have resource limits", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.resources.limits.memory
          msg := sprintf("Container %v must have memory limits", [container.name])
        }
---
# Constraint: Enforce resource limits.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireResourceLimits
metadata:
  name: platform-operator-require-limits
  labels:
    app.kubernetes.io/name: platform-operator
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces:
      - platform-operator-system
