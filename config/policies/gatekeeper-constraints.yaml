# ======================================================================
# OPA Gatekeeper Constraints for Platform Operator
# These policies enforce security best practices on the operator
# deployment and the resources it manages.
#
# Prerequisites: OPA Gatekeeper v3.x installed in the cluster.
# ======================================================================

# Constraint Template: Require non-root containers.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenonroot
  labels:
    app.kubernetes.io/name: platform-operator
    policy: security
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenonroot

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.securityContext.runAsNonRoot
          msg := sprintf("Container %v must set securityContext.runAsNonRoot: true", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          container.securityContext.runAsNonRoot == false
          msg := sprintf("Container %v must not run as root", [container.name])
        }
---
# Constraint: Enforce non-root on all operator deployments.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireNonRoot
metadata:
  name: platform-operator-require-non-root
  labels:
    app.kubernetes.io/name: platform-operator
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces:
      - platform-operator-system
---
