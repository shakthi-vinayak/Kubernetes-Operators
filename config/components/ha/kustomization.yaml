# Kustomize Component: High Availability
# Adds PDB, anti-affinity, and multi-replica configuration.
# Usage: Include as a component in your kustomization.yaml:
#   components:
#     - ../../components/ha

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ../../ha

patches:
  - target:
      kind: Deployment
      name: controller-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        replicas: 2
        template:
          spec:
            terminationGracePeriodSeconds: 120
            containers:
              - name: manager
                args:
                  - --leader-elect
                  - --health-probe-bind-address=:8081
                  - --metrics-bind-address=:8080
                  - --concurrent-reconciles=3
                startupProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  failureThreshold: 30
                  periodSeconds: 2
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    control-plane: controller-manager
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          control-plane: controller-manager
                      topologyKey: kubernetes.io/hostname
