# Blue-Green Deployment for Platform Operator
#
# Uses Argo Rollouts blue-green strategy for zero-downtime deployments.
# Traffic is switched atomically from the old (green) to the new (blue)
# revision after health checks pass.
#
# Usage:
#   kubectl apply -f gitops/progressive-delivery/blue-green.yaml

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: platform-operator-bluegreen
  namespace: platform-operator-system
  labels:
    app.kubernetes.io/name: platform-operator
    app.kubernetes.io/part-of: platform
    strategy: blue-green
spec:
  replicas: 2
  strategy:
    blueGreen:
      # Active service receives production traffic
      activeService: platform-operator-active
      # Preview service receives no production traffic (for validation)
      previewService: platform-operator-preview
      # Auto-promote after preview is healthy
      autoPromotionEnabled: true
      autoPromotionSeconds: 120
      # Pre-promotion analysis
      prePromotionAnalysis:
        templates:
          - templateName: operator-health-check
        args:
          - name: service-name
            value: platform-operator-preview
      # Scale down delay for safe rollback
      scaleDownDelaySeconds: 300
      # Abort on analysis failure
      abortScaleDownDelaySeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-operator
      control-plane: controller-manager
      strategy: blue-green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-operator
        control-plane: controller-manager
        strategy: blue-green
    spec:
      serviceAccountName: platform-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/shakthi-vinayak/kubernetes-operators:latest
          command: ["/manager"]
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --concurrent-reconciles=3
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 120
---
# Active service: receives production traffic
apiVersion: v1
kind: Service
metadata:
  name: platform-operator-active
  namespace: platform-operator-system
spec:
  selector:
    app.kubernetes.io/name: platform-operator
    control-plane: controller-manager
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
# Preview service: for validation before promotion
apiVersion: v1
kind: Service
metadata:
  name: platform-operator-preview
  namespace: platform-operator-system
spec:
  selector:
    app.kubernetes.io/name: platform-operator
    control-plane: controller-manager
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
