name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ======================================================================
  # Run full test suite before releasing
  # ======================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Run tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...

  # ======================================================================
  # Multi-architecture container build and push to GHCR
  # ======================================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ======================================================================
  # Vulnerability scan on the released image
  # ======================================================================
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan on released image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  # ======================================================================
  # Generate SBOM and sign the image
  # ======================================================================
  sbom-and-sign:
    name: SBOM & Sign
    runs-on: ubuntu-latest
    needs: [build-and-push, scan]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom

      - name: Sign container image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Attach SBOM to image
        run: |
          cosign attach sbom --sbom sbom.spdx.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}

  # ======================================================================
  # Create GitHub Release with manifests and Helm chart
  # ======================================================================
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, scan]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate install manifests
        run: |
          mkdir -p dist
          # Generate CRDs using controller-gen
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2
          controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases

          # Combine all install manifests into a single file
          cat config/crd/bases/*.yaml > dist/install.yaml 2>/dev/null || true
          echo "---" >> dist/install.yaml
          cat config/rbac/service_account.yaml >> dist/install.yaml
          echo "---" >> dist/install.yaml
          cat config/rbac/role.yaml >> dist/install.yaml
          echo "---" >> dist/install.yaml
          cat config/rbac/role_binding.yaml >> dist/install.yaml
          echo "---" >> dist/install.yaml

          # Generate manager deployment with the release image
          cat <<EOF >> dist/install.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: platform-operator-controller-manager
            namespace: platform-operator-system
            labels:
              app.kubernetes.io/name: platform-operator
              app.kubernetes.io/version: ${{ github.ref_name }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            template:
              metadata:
                labels:
                  control-plane: controller-manager
              spec:
                serviceAccountName: platform-operator
                containers:
                  - name: manager
                    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
                    command: ["/manager"]
                    args:
                      - "--leader-elect"
                      - "--metrics-bind-address=:8080"
                      - "--health-probe-bind-address=:8081"
                    ports:
                      - containerPort: 8080
                        name: metrics
                      - containerPort: 8081
                        name: health
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                    resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 100m
                        memory: 128Mi
                    securityContext:
                      runAsNonRoot: true
                      readOnlyRootFilesystem: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
          EOF

      - name: Package Helm chart
        run: |
          if [ -d "charts/platform-operator" ]; then
            helm package charts/platform-operator --version "${{ github.ref_name }}" --app-version "${{ github.ref_name }}" -d dist/
          fi

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changelog" > release-notes.md
            echo "" >> release-notes.md
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> release-notes.md
          else
            echo "## Release ${{ github.ref_name }}" > release-notes.md
            echo "" >> release-notes.md
            echo "Initial release of the Platform Operator." >> release-notes.md
          fi
          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Installation" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.yaml" >> release-notes.md
          echo '```' >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/install.yaml
            dist/*.tgz
            sbom.spdx.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
